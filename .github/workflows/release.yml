name: release

# Publishes both Kotlin artifacts to Maven Central when a vX.Y.Z tag is
# pushed. (The Swift SDK needs no publish step — SPM consumes the tag
# directly.) Requires these repository secrets:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  — Central Portal user token
#   SIGNING_KEY                                      — ASCII-armored GPG secret key
#   SIGNING_KEY_PASSWORD                             — its passphrase
on:
  push:
    tags: ['v*']
  # Manual runs publish WITHOUT auto-release: a -SNAPSHOT version goes to the
  # snapshot channel; a release version is staged for review in the portal UI.
  workflow_dispatch:

jobs:
  maven-central:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to Maven Central
        run: ./gradlew ${{ github.event_name == 'push' && 'publishAndReleaseToMavenCentral' || 'publishToMavenCentral' }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

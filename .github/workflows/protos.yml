name: protos

on:
  pull_request:

jobs:
  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Compile protos
        run: buf build
      - name: Breaking-change check against main
        run: buf breaking --against ".git#branch=origin/main"
